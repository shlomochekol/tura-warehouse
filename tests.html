<script>
/* בידוד מוחלט מה-localStorage האמיתי של הדפדפן — קובץ בדיקות אסור שייגע
   אי פעם בנתונים אמיתיים, גם אם נפתח באותו דפדפן/פרופיל כמו האפליקציה עצמה. */
(function () {
  const mem = {};
  const fakeLS = {
    getItem: k => Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null,
    setItem: (k, v) => { mem[k] = String(v); },
    removeItem: k => { delete mem[k]; },
    clear: () => { Object.keys(mem).forEach(k => delete mem[k]); },
    key: i => Object.keys(mem)[i] || null,
    get length() { return Object.keys(mem).length; }
  };
  try { Object.defineProperty(window, 'localStorage', { value: fakeLS, configurable: true }); }
  catch (e) { window.localStorage = fakeLS; }
})();
</script>

<script>
/* 99-boot.js לא נטען בכוונה — הוא מפעיל את האפליקציה בפועל (רינדור מסכים,
   קריאה ל-selfTest אוטומטית, הצגת מסך כניסה). כאן רק בונים state תקין

   קרוב ככל האפשר לאפליקציה האמיתית (סרגל ניווט בנוי, מסך עם תוכן) */

<script>
/* ============================================================
   חבילת בדיקות רגרסיה — תופסת בדיוק את סוג הבאגים שכבר קרו בעבר:
   שורות LionWheel עם "מבצע"/תבנית "X+Y" שנופלות בטעות, "דולצ'טו" עם
   גרש לא סטנדרטי, טבלת inv_log חסרה שמפילה סנכרון, חישובי ארגזים/משטחים.
   כל בדיקה עצמאית ולא נשענת על localStorage אמיתי (ראו הבידוד למעלה).
   ============================================================ */
(async function () {
  const T = [];
  function ok(name, cond, detail) { T.push({ name, pass: !!cond, detail: detail || '' }); }
  function eq(name, actual, expected) {
    ok(name, JSON.stringify(actual) === JSON.stringify(expected),
      'actual=' + JSON.stringify(actual) + ' expected=' + JSON.stringify(expected));
  }

  // ---- LionWheel: promo/bundle lines with a valid catalog barcode must be kept ----
  try {
    const cell = [
      '20.0: קברנה ויסטה 2024 - 10 + 2 מבצע חג(7290019158639)',   // has מבצע word + valid barcode
      '55.0: רוזה 2025 11+1(7290019158547)',                       // N+M pattern, NO מבצע word — the real bug found live
      '5.0: רוזה 2025(7290019158547)',
      "5.0: דולצ'טו 2022 (7290019158777)",                          // straight apostrophe
      '5.0: דולצ׳טו 2023 (7290019158778)',                     // Hebrew geresh
      '1.0: משלוח חינם',                                            // must stay excluded
      '3.0: מבצע קיץ (0)',                                          // promo + invalid barcode -> excluded
      '12.0: מארז מבצע 3 יינות (123)',                              // promo + short barcode -> excluded
    ].join('\n');
    const out = parseItemsCell(cell);
    const names = out.map(o => o.name);
    ok('LionWheel: "10+2 מבצע חג" עם ברקוד תקין נכלל', names.some(n => n.indexOf('קברנה ויסטה') >= 0), names.join(' | '));
    ok('LionWheel: "רוזה 2025 11+1" בלי מילת מבצע אבל עם ברקוד תקין נכלל (הבאג האמיתי שנתפס)',
      out.some(o => o.name.indexOf('11+1') >= 0 && o.qty === 55), JSON.stringify(out.filter(o => o.name.indexOf('רוזה') >= 0)));
    const rozeTotal = out.filter(o => o.name.indexOf('רוזה') >= 0).reduce((t, o) => t + o.qty, 0);
    eq('LionWheel: סך יחידות רוזה 2025 = 55+5', rozeTotal, 60);
    ok('LionWheel: דולצ\'טו עם גרש ישר מקבל סיומת', out.some(o => /דולצ.*כולל מארז יחיד/.test(o.name)) , names.join(' | '));
    ok('LionWheel: דולצ\'טו עם גרש עברי (׳) גם מקבל סיומת', names.filter(n => n.indexOf('כולל מארז יחיד') >= 0).length >= 2, names.join(' | '));
    ok('LionWheel: "משלוח חינם" נשאר מסונן', !names.some(n => n.indexOf('משלוח') >= 0), names.join(' | '));
    ok('LionWheel: "מבצע קיץ" עם ברקוד "0" (לא 13 ספרות) נשאר מסונן', !names.some(n => n.indexOf('מבצע קיץ') >= 0), names.join(' | '));
    ok('LionWheel: "מארז מבצע" עם ברקוד קצר נשאר מסונן', !names.some(n => n.indexOf('מארז מבצע') >= 0), names.join(' | '));
  } catch (e) { ok('LionWheel: פארסינג לא קרס', false, e.message); }

  // ---- inv_log: logInv records correctly and doesn't crash on missing entry fields ----
  try {
    const bak = state.invLog; state.invLog = [];
    const rec = logInv({ id: 't1', category: 'בדיקה', vintage: '', type: '', prow: 1, pcol: 1, plevel: 1 }, 10, 7, 'manual');
    ok('inv_log: logInv רושם before/after/delta נכון', !!rec && rec.before === 10 && rec.after === 7 && rec.delta === -3, JSON.stringify(rec));
    ok('inv_log: logInv לא רושם כשאין שינוי', logInv({ id: 't2', category: 'x' }, 5, 5, 'manual') === null, '');
    state.invLog = bak;
  } catch (e) { ok('inv_log: logInv לא קרס', false, e.message); }

  // ---- Supabase error translation (the exact live incident: missing inv_log table blocked login) ----
  try {
    const raw = "(404) Could not find the table 'public.inv_log' in the schema cache";
    ok('Supabase: מזהה טבלה חסרה כ-"missing table"', isMissingTableErr({ message: raw }), raw);
    const friendly = sbFriendlyError({ message: raw });
    ok('Supabase: שגיאת טבלה חסרה מתורגמת לעברית ברורה, לא נשארת גולמית',
      friendly.indexOf('Could not find') === -1 && friendly.indexOf('טבלה חסרה') >= 0, friendly);
    ok('Supabase: __RELOGIN__ מתורגם להודעה ברורה', sbFriendlyError({ message: '__RELOGIN__' }).indexOf('להתחבר מחדש') >= 0, '');
  } catch (e) { ok('Supabase: שכבת תרגום שגיאות לא קרסה', false, e.message); }

  // ---- sync race guard: sbPushChanged must never touch the cloud before the first
  // sbPull() has succeeded in this page load — otherwise _sbRowSnap is still empty and
  // every local row looks "changed", so a stale device overwrites a fresher cloud row.
  // This is the exact live incident: שרדונה 2024's location (1-3 / column 7, set on
  // another device) reverted to a stale local copy (column 4) after a reload. ----
  try {
    const bakPulled = _sbPulledOnce, bakToken = SB.token, bakBiz = SB.biz, bakWait = _sbPullWait, bakSnap = _sbSnap;
    const bakSyncTable = window.sbSyncTable, bakPushState = window.sbPushState, bakBumpVer = window.sbBumpVer;
    let calledSync = false;
    window.sbSyncTable = function () { calledSync = true; return Promise.resolve({ merged: false, add: 0, upd: 0, del: 0 }); };
    window.sbPushState = function () { return Promise.resolve(); };
    window.sbBumpVer = function () { return Promise.resolve(); };
    try {
      SB.token = 'test-token'; SB.biz = 'test-biz'; _sbPullWait = false; _sbSnap = null;
      _sbPulledOnce = false;
      await sbPushChanged(true);
      ok('סנכרון: sbPushChanged לא דוחף לענן לפני משיכה ראשונה מוצלחת (הבאג האמיתי: מיקום שרדונה 2024 שנדרס)', !calledSync, '');
      _sbPulledOnce = true;
      await sbPushChanged(true);
      ok('סנכרון: sbPushChanged פועל כרגיל אחרי שהמשיכה הראשונה הצליחה', calledSync, '');
    } finally {
      _sbPulledOnce = bakPulled; SB.token = bakToken; SB.biz = bakBiz; _sbPullWait = bakWait; _sbSnap = bakSnap;
      window.sbSyncTable = bakSyncTable; window.sbPushState = bakPushState; window.sbBumpVer = bakBumpVer;
    }
  } catch (e) { ok('סנכרון: מנגנון מניעת הדריסה לא קרס', false, e.message); }

  // ---- Google Calendar: event body construction (pure, no network) ----
  try {
    const bakMins = state.settings.gcalReminderMins;
    state.settings.gcalReminderMins = 45;
    const dayTask = { title: 'ספירת מלאי', notes: '', zone: 'ספירת מלאי', due: '2026-09-20', time: '' };
    const dayEv = gcalEventBody(dayTask);
    ok('gcal: משימה בלי שעה -> אירוע "יום שלם" (date, לא dateTime)', !!(dayEv.start && dayEv.start.date === '2026-09-20' && !dayEv.start.dateTime), JSON.stringify(dayEv.start));
    eq('gcal: אירוע יום שלם מסתיים למחרת', dayEv.end.date, '2026-09-21');
    const timedTask = { title: 'פגישה עם ספק', notes: 'לתאם משלוח', zone: 'קבלה', due: '2026-09-20', time: '23:50' };
    const timedEv = gcalEventBody(timedTask);
    ok('gcal: משימה עם שעה -> dateTime עם timeZone', !!(timedEv.start && timedEv.start.dateTime && timedEv.start.timeZone), JSON.stringify(timedEv.start));
    ok('gcal: אירוע עם שעה חוצה חצות נכון (23:50 + 30 דק\' -> 20.9 ל-21.9)',
      timedEv.start.dateTime.indexOf('2026-09-20T23:50') === 0 && timedEv.end.dateTime.indexOf('2026-09-21T00:20') === 0,
      JSON.stringify({ start: timedEv.start.dateTime, end: timedEv.end.dateTime }));
    eq('gcal: התזכורת נלקחת מהגדרות (לא ברירת מחדל של Google)', timedEv.reminders, { useDefault: false, overrides: [{ method: 'popup', minutes: 45 }] });
    state.settings.gcalReminderMins = bakMins;
  } catch (e) { ok('gcal: בניית גוף האירוע לא קרסה', false, e.message); }

  // ---- Google Calendar: not-connected guard + friendly errors ----
  try {
    const bakToken = _gcalToken, bakExp = _gcalTokenExp;
    _gcalToken = ''; _gcalTokenExp = 0;
    let threw = null;
    try { await gcalApi('POST', '', {}); } catch (e) { threw = e; }
    ok('gcal: קריאת API בלי חיבור נכשלת מיד עם שגיאה מזוהה (לא שולחת בקשת רשת)', threw && threw.message === '__GCAL_NOT_CONNECTED__', threw && threw.message);
    ok('gcal: השגיאה מתורגמת לעברית ברורה', gcalFriendlyError(threw).indexOf('להתחבר קודם') >= 0, gcalFriendlyError(threw));
    _gcalToken = bakToken; _gcalTokenExp = bakExp;
  } catch (e) { ok('gcal: הגנת "לא מחובר" לא קרסה', false, e.message); }

  // ---- deduct/return round trip ----
  try {
    const e0 = state.entries.find(x => (+x.units || 0) >= 10) || state.entries[0];
    const before = +e0.units || 0;
    _dedShip = { client: 'test', category: e0.category, vintage: e0.vintage, units: 3 };
    _dedPick = {}; _dedPick[e0.id] = 3;
    dedApply();
    const afterDeduct = +state.entries.find(x => x.id === e0.id).units;
    eq('deduct: ניכוי 3 יחידות', afterDeduct, before - 3);
    const s = { deducted: 1, dedRec: [{ id: e0.id, take: 3 }], client: 'test' };
    state.shipments.push(s);
    const _origConfirm = window.confirm; window.confirm = () => true; // dedUndo מבקש אישור — עוקפים רק כאן
    try { dedUndo(state.shipments.length - 1); } finally { window.confirm = _origConfirm; }
    const afterUndo = +state.entries.find(x => x.id === e0.id).units;
    eq('deduct: החזרה חוזרת לכמות המקורית', afterUndo, before);
    state.shipments.pop();
  } catch (e) { ok('deduct/return: לא קרס', false, e.message); }

  // ---- box/pallet math sanity ----
  try {
    const d = derive({ category: 'הרטלנד', label: 'מתוות עברית', units: 1200 });
    eq('חישוב: 1200 יח\' ÷ 12 = 100 ארגזים', Math.round(d.boxes), 100);
    eq('חישוב: MP לא מתוות = 12 ליחידה', bpb('MP', 'לא מתוות'), 12);
    eq('חישוב: MP מתוות = 6 ליחידה', bpb('MP', 'מתוות עברית'), 6);
  } catch (e) { ok('חישובי ארגזים/משטחים לא קרסו', false, e.message); }

  // ---- selfTest() / dataAudit() must not throw and selfTest must be fully green ----
  try {
    const st = selfTest();
    const failed = st.filter(x => x.pass === false);
    ok('selfTest(): כל הבדיקות הפנימיות ירוקות', failed.length === 0, failed.map(x => x.n).join(', '));
  } catch (e) { ok('selfTest(): לא קרס', false, e.message); }
  try { dataAudit(); ok('dataAudit(): לא קרס', true); } catch (e) { ok('dataAudit(): לא קרס', false, e.message); }

  // ---- sw.js cache-version sanity (best effort — needs http(s), skipped silently under file://) ----
  function renderResults() {
    const passCount = T.filter(x => x.pass).length;
    const failCount = T.length - passCount;
    let h = '<h1>בדיקות רגרסיה — יקב טורא</h1>';
    h += '<div id="testSummary" style="color:' + (failCount ? 'var(--warn)' : 'var(--ok)') + '">' +
      (failCount ? ('⚠ ' + failCount + ' בדיקות נכשלו מתוך ' + T.length) : ('✓ כל ' + T.length + ' הבדיקות עברו')) + '</div>';
    T.forEach(t => {
      h += '<div class="trow ' + (t.pass ? 'pass' : 'fail') + '"><span class="mark">' + (t.pass ? '✓' : '✗') + '</span>' +
        '<div><div>' + t.name + '</div>' + (t.detail ? '<div class="detail">' + t.detail.replace(/</g, '&lt;') + '</div>' : '') + '</div></div>';
    });
    document.getElementById('testResults').innerHTML = h;
    document.title = (failCount ? '(' + failCount + ' נכשלו) ' : '✓ ') + 'בדיקות רגרסיה';
  }

  try {
    fetch('sw.js').then(r => r.text()).then(t => {
      const m = t.match(/CACHE\s*=\s*'([^']+)'/);
      ok('sw.js: קיים משתנה CACHE (גרסת מטמון)', !!m, m ? m[1] : 'לא נמצא');
      renderResults();
    }).catch(() => renderResults());
  } catch (e) { renderResults(); }
})();
