<script>
/* PWA: offline + install */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-block';});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.style.display='none';if(window.toast)toast('האפליקציה הותקנה ✓');});
async function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none';}
  else if(isIOS){alert('להתקנה באייפון:\n1. לחץ על כפתור השיתוף ⬆ בסרגל הספארי\n2. בחר "הוסף למסך הבית"');}
  else{alert('פתח את תפריט הדפדפן ובחר "התקן אפליקציה" / "Add to Home screen".');}
}
if(isIOS && !standalone){const b=document.getElementById('installBtn');if(b)b.style.display='inline-block';}
</script>

@media(max-width:640px){.tk-row3{grid-template-columns:1fr}}
.tk-subs{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.tk-subrow{display:flex;gap:6px;align-items:center}
.tk-subrow input[type=text],.tk-subrow input:not([type]){flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:7px}
.tk-subrow input.sdone{text-decoration:line-through;color:var(--muted)}
.tk-photos{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.tk-phw{position:relative}
.tk-phw img{width:82px;height:82px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.tk-phw .del{position:absolute;top:-6px;left:-6px;background:#fff;border-radius:50%;border:1px solid var(--line);width:20px;height:20px;line-height:1}
.tk-log{margin-top:8px;font-size:11px}
.tk-log summary{cursor:pointer;color:var(--navy);font-weight:700}
.tk-logrow{padding:3px 0;border-bottom:1px solid var(--line);color:#555}
.tk-logrow span{color:var(--muted);margin-inline-end:6px}
.tk-tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(max-width:640px){.tk-tpls{grid-template-columns:1fr}}
.tk-tpl{text-align:right;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tk-tpl:hover{border-color:var(--gold);background:#FFFDF7}
.tk-tpl b{color:var(--wine);font-size:13px}
.tk-tpl span{font-size:11px;color:var(--muted)}

.wide-panel{width:100%}
.tk-modes{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.tk-modes button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 13px;font-size:13px;cursor:pointer;font-weight:600}
.tk-modes button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bd-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px;font-size:13px}
.bdtbl{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px}
.bdtbl th{background:var(--navy);color:#fff;padding:6px 4px;font-size:11px;text-align:center;vertical-align:top}
.bdtbl th small{opacity:.8;font-weight:400}
.bdtbl td{border:1px solid var(--line);padding:2px;vertical-align:top}
.bdtbl td.bd-cat,.bdtbl th.bd-cat{width:110px;background:#F4EFE6;color:var(--wine);font-weight:700;font-size:12px;text-align:right;padding:6px 8px}
.bdtbl .bd-today{background:#FFF8E6}
.bdtbl th.bd-today{background:#8a6a12}
.bd-ta{width:100%;border:none;background:transparent;resize:none;font:inherit;font-size:12px;padding:5px 6px;overflow:hidden;min-height:34px}
.bd-ta:focus{outline:2px solid var(--gold);border-radius:5px;background:#fff}
.bd-hol{background:var(--gold);color:#3a2c00;border-radius:6px;font-size:9px;padding:0 4px;margin-top:2px;display:inline-block}
.bd-cnt{font-size:9.5px;color:#2C6B2C;background:#EAF3EA;border-radius:6px;padding:0 5px;margin-top:2px;display:inline-block}
.bd-mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.bd-dh{background:var(--navy);color:#fff;text-align:center;font-size:11px;padding:4px;border-radius:6px}
.bd-day{min-height:78px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;cursor:pointer;background:#fff;overflow:hidden}
.bd-day:hover{border-color:var(--gold);background:#FFFDF7}
.bd-day.bd-empty{background:transparent;border:none;cursor:default}
.bd-day.bd-today{border-color:var(--gold);background:#FFF8E6}
.bd-dnum{font-weight:800;color:var(--wine);font-size:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bd-txt{font-size:10.5px;color:#444;line-height:1.35;margin-top:3px;white-space:pre-wrap}
.bd-dtasks div{padding:5px 7px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;font-size:12px;cursor:pointer}
@media(max-width:640px){.bd-day{min-height:62px}.bd-txt{font-size:9.5px}}

.dg-bad{color:#c33;font-weight:700}
.planbanner{position:fixed;bottom:0;left:0;right:0;z-index:400;text-align:center;padding:7px 12px;font-size:13px;font-weight:600}
.planbanner.warn{background:var(--gold);color:#3a2c00}
.planbanner.blocked{background:#C0202B;color:#fff}
</style>


<div id="loginov" class="loginov" style="display:none">
  <div class="loginbox">
    <div class="lg-brand">יקב טורא</div>
    <h3 id="lg_title">כניסה</h3>
    <div class="lg-field"><label>אימייל</label><input id="lg_email" type="email" autocomplete="email" placeholder="name@example.com"></div>
    <div class="lg-field"><label>סיסמה</label><input id="lg_pw" type="password" autocomplete="current-password" placeholder="לפחות 6 תווים"></div>
    <div class="lg-field" id="lg_bizwrap" style="display:none"><label>שם העסק</label><input id="lg_biz" placeholder="יקב טורא"></div>
    <div id="lg_msg" class="lg-msg"></div>
    <button id="lg_submit" class="btn lg-submit" onclick="sbSubmitLogin()">כניסה</button>
    <button id="lg_toggle" class="lg-toggle" onclick="sbToggleMode()">אין לי חשבון — הרשמה</button>
  </div>
</div>
<div id="planBanner" class="planbanner" style="display:none"></div>
<div id="bcscan" class="scanov" style="display:none"><div class="scanbox">
  <video id="bcvid" class="scanvid" muted playsinline></video>
  <canvas id="bccan" style="display:none"></canvas>
  <div class="bcframe"></div>
  <div id="bcmsg" class="scanmsg"></div>
  <div class="scanbtns">
    <button class="btn ghost sm" id="bctorch" style="display:none" onclick="toggleBcTorch()">🔦 פנס</button>
    <button class="btn ghost sm" onclick="closeBarcodeScan();promptBarcode()">⌨ הקלדה</button>
    <button class="btn" onclick="closeBarcodeScan()">סגור</button>
  </div>
</div></div>
</body>
</html>
